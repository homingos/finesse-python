name: Release

# Publishes flam-finesse to PyPI when a version tag (v0.1.1, ...) is pushed, with PyPI Trusted
# Publishing (GitHub OIDC): no PyPI token is stored. Before the first tag, add a (pending) trusted
# publisher for flam-finesse on PyPI: repository homingos/finesse-python, workflow release.yml,
# environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/flam_finesse/_version.py)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match src/flam_finesse/_version.py ($v)" >&2
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/flam_finesse
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v5
      - run: uv publish --trusted-publishing always
