[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flam-finesse"
dynamic = ["version"]
description = "Python SDK for the Finesse voice API: voice cloning, text-to-speech and realtime streaming."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Flam" }]
keywords = ["finesse", "flam", "tts", "text-to-speech", "voice", "voice-cloning", "realtime"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "typing-extensions>=4.7",
  "websockets>=14",
]

[project.urls]
Homepage = "https://finesse.flamapp.ai"
Documentation = "https://docs.finesse.flamapp.ai"
Repository = "https://github.com/homingos/finesse-python"
Changelog = "https://github.com/homingos/finesse-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.version]
path = "src/flam_finesse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flam_finesse"]

# Only what a source build needs; local tool files and README images stay out.
[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "examples/", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls a real Finesse API (needs FINESSE_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
