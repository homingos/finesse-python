[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "flam-finesse"
dynamic = ["version"]
description = "Python SDK for the Finesse voice API: voice cloning, text-to-speech and realtime streaming."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Flam" }]
keywords = ["finesse", "flam", "tts", "text-to-speech", "voice", "voice-cloning", "realtime"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "typing-extensions>=4.7",
  "websockets>=14",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.hatch.version]
path = "src/flam_finesse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/flam_finesse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls a real Finesse API (needs FINESSE_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
